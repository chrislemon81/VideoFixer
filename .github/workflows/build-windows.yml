name: Build Windows app

on:
  push:
    paths:
      - "videofixer.py"
      - "tests/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $bin = (Get-ChildItem ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "$bin\ffmpeg.exe", "$bin\ffprobe.exe" package\
          Add-Content $env:GITHUB_PATH (Resolve-Path package).Path

      - name: Run tests on Windows
        run: python -m unittest discover -s tests -v

      - name: Build VideoFixer.exe
        run: |
          python -m pip install pyinstaller
          pyinstaller --onefile --windowed --name VideoFixer videofixer.py

      - name: Package
        shell: pwsh
        run: |
          Copy-Item dist\VideoFixer.exe package\
          Copy-Item README.md package\

      - uses: actions/upload-artifact@v4
        with:
          name: VideoFixer-Windows
          path: package/
